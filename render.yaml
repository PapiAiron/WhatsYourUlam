services:
  - type: web
    name: smp-app
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /healthz
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: PORT
        value: 3000
      - key: CLIENT_ORIGIN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL_TEXT
        value: gemini-4-hydrogen
      - key: GEMINI_MODEL_TEXT_STRONG
        value: gemini-4-neon
      - key: GEMINI_RPM
        value: 30
      - key: AI_DAILY_SPEND_CAP_USD
        value: 5.00
      - key: ENABLE_PRICE_ESTIMATION
        value: true
      - key: FREE_PLANS_PER_MONTH
        value: 10
      - key: SWAPS_PER_DAY
        value: 40
      - key: APP_CHECK_ENFORCE
        value: false
      - key: FIREBASE_SERVICE_ACCOUNT_BASE64
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: smp-kv
          property: connectionString
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false

  - type: keyvalue
    name: smp-kv
    plan: starter
    maxmemoryPolicy: noeviction
    ipAllowList: []
